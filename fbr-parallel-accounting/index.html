<!doctype html>
<html><head><meta charset="utf-8"><title>FBR smoke</title></head>
<body>
<pre id="result">starting</pre>
<iframe id="frame" src="file:///D:/Setup/-Trash/manager-extensions/manager-io-extensions/fbr-parallel-accounting/index.html" style="width:1400px;height:900px"></iframe>
<script>
const result = document.getElementById('result');
const frame = document.getElementById('frame');
const log = [];
function out(obj) { result.textContent = JSON.stringify(obj, null, 2); }
function nowDate() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const todayStr = nowDate();
const yearStart = todayStr.slice(0,4) + '-01-01';
const FBR_GUIDS = [
  'ad12b60b-23bf-4421-94df-8be79cef533e',
  '58b9eb90-f6b8-4abc-8ea1-12fd77b8336e',
  '245e5943-0092-409d-96ae-e2ee10eac75b',
  '274fc6d0-2eac-43d0-8286-79c856e644aa',
  '5ea52bc4-90ae-4e4a-aec4-ef1224b279ad',
  '7662b887-c8d8-486e-98fd-f9dbcd41c6dc',
  '79f99d26-e43a-4ecb-a9c9-0774601a9b2e',
  '02572e0c-0167-4dbd-a392-08d8f67f3fe4',
  'dea4f923-c498-4504-b3ef-30be3c33175e'
];
const DOC_KEY = '11111111-1111-4111-8111-111111111111';
const GL_KEY = '22222222-2222-4222-8222-222222222222';
const items = (arr) => ({ items: arr });
const folders = [];
let lastCreated = null;
const api = {
  '/api4/checkbox-custom-fields': items([{ key: 'cf-chk', name: 'FBR', placement: FBR_GUIDS }]),
  '/api4/text-custom-fields': items([{ key: 'cf-adj', name: 'FBR Adjustment', placement: [] }]),
  '/api4/business-details': { name: 'SMOKE TEST BUSINESS' },
  '/api4/profit-and-loss-statement-account-batch': items([
    { key: 'acc-sales', item: { key: 'acc-sales', name: 'Sales', code: '4000', nameWithCode: '4000 Sales', group: 'grp-income', isProfitAndLossAccount: true } }
  ]),
  '/api4/balance-sheet-account-batch': items([
    { key: 'acc-bank', item: { key: 'acc-bank', name: 'Bank', code: '1000', nameWithCode: '1000 Bank', group: 'grp-assets', isCashAtBank: true } }
  ]),
  '/api4/profit-and-loss-statement-group-batch': items([{ key: 'grp-income', item: { key: 'grp-income', name: 'Income' } }]),
  '/api4/balance-sheet-group-batch': items([{ key: 'grp-assets', item: { key: 'grp-assets', name: 'Assets' } }]),
  '/api4/customers': items([{ key: 'cust-1', name: 'Smoke Customer' }]),
  '/api4/base-currency': items([{ key: 'BASE', code: 'PKR' }]),
  '/api4/folders': items([]),
  '/api4/sales-invoices': items([{
    key: DOC_KEY,
    item: {
      key: DOC_KEY, date: yearStart, reference: 'SI-SMOKE', customer: 'cust-1',
      customFields2: { booleans: { 'cf-chk': true } }
    }
  }]),
  '/api4/general-ledger-transactions-batch': items([{
    key: GL_KEY,
    item: { key: GL_KEY, description: 'FBR-GL-SOURCE ' + yearStart + ' to ' + todayStr, fromDate: yearStart, toDate: todayStr }
  }]),
  '/api4/general-ledger-transactions-view': {
    rows: [
      { name: '4000 Sales', rows: [{ name: 'Sale', cells: [
        { value: 0, link: { href: '/api4/sales-invoice-form/' + DOC_KEY } },
        { value: 1000, link: { href: '/api4/sales-invoice-form/' + DOC_KEY } },
        { value: 1000 }
      ] }] },
      { name: 'Profit & Loss for the Period', isBold: true, cells: [{ value: 1000 }, { value: 1000 }] },
      { name: '1000 Bank', rows: [{ name: 'Receipt', cells: [
        { value: 1000, link: { href: '/api4/sales-invoice-form/' + DOC_KEY } },
        { value: 0, link: { href: '/api4/sales-invoice-form/' + DOC_KEY } },
        { value: 1000 }
      ] }] }
    ]
  }
};

function addFolder(description, customFields2) {
  const key = 'folder-' + (folders.length + 1);
  const item = { Key: key, Description: description, CustomFields2: customFields2 || { Strings: {} } };
  folders.push({ key: key, item: item });
  lastCreated = { key: key, value: { description: description } };
  return key;
}

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.type !== 'api-request' || !frame.contentWindow) return;
  const path = String(data.path || '').split('?')[0];
  if (data.method === 'GET' && path === '/api4/folders') {
    frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, body: { items: folders } }, '*');
    log.push('ok folders (' + folders.length + ')');
  } else if (data.method === 'POST' && path === '/api4/folder-form') {
    const body = data.body || {};
    const key = addFolder(body.Description || '', body.CustomFields2);
    frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, body: folders[folders.length - 1].item }, '*');
    log.push('created folder form ' + key);
  } else if (data.method === 'PUT' && path.indexOf('/api4/folder-form/') === 0) {
    const key = decodeURIComponent(path.slice('/api4/folder-form/'.length));
    const folder = folders.find((entry) => entry.key === key);
    if (!folder) {
      frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, error: 'HTTP 404: folder ' + key }, '*');
      log.push('404 put folder form ' + key);
    } else {
      const body = data.body || {};
      folder.item.Description = body.Description || folder.item.Description;
      folder.item.CustomFields2 = body.CustomFields2 || folder.item.CustomFields2;
      lastCreated = { key: key, value: { description: folder.item.Description } };
      frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, body: {} }, '*');
      log.push('updated folder form ' + key);
    }
  } else if (data.method === 'GET' && path.indexOf('/api4/folder-form/') === 0) {
    const key = decodeURIComponent(path.slice('/api4/folder-form/'.length));
    const folder = folders.find((entry) => entry.key === key);
    frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, body: folder ? folder.item : null }, '*');
    log.push('ok folder form ' + key);
  } else if (data.method === 'POST' && path === '/api4/folder') {
    const value = data.body && data.body.value ? data.body.value : {};
    const key = addFolder(value.description || '', value.customFields2 ? { Strings: value.customFields2.strings } : null);
    frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, body: key }, '*');
    log.push('created folder ' + key);
  } else if (data.method === 'POST' && path === '/api4/general-ledger-transactions-form') {
    frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, body: { Key: GL_KEY } }, '*');
    log.push('created gl form');
  } else if (data.method === 'GET' && api[path] !== undefined) {
    frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, body: api[path] }, '*');
    log.push('ok ' + path);
  } else if (data.method === 'GET' || data.method === 'PUT') {
    frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, error: 'HTTP 404: no fixture for ' + path }, '*');
    log.push('404 ' + path);
  } else {
    frame.contentWindow.postMessage({ type: 'api-response', requestId: data.requestId, body: { key: 'created' } }, '*');
    log.push(data.method + ' ' + path);
  }
});

function waitFor(fn, timeoutMs) {
  return new Promise((resolve, reject) => {
    const started = Date.now();
    const timer = setInterval(() => {
      try {
        const value = fn();
        if (value) { clearInterval(timer); resolve(value); }
        else if (Date.now() - started > timeoutMs) { clearInterval(timer); reject(new Error('timeout')); }
      } catch (e) { clearInterval(timer); reject(e); }
    }, 80);
  });
}

frame.addEventListener('load', async () => {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const errors = [];
  win.addEventListener('error', (e) => errors.push(String(e.message || e.error)));
  const origError = win.console.error;
  win.console.error = function (...args) { errors.push(args.map(String).join(' ')); origError.apply(win.console, args); };
  try {
    win.postMessage({ type: 'manager-context', payload: { business: 'SMOKE TEST BUSINESS' } }, '*');
    await waitFor(() => doc.querySelector('#conn-text') && /Connected:/.test(doc.querySelector('#conn-text').textContent), 8000);
    const loadedBadge = await waitFor(() => doc.querySelector('#badge-docs') && Number(doc.querySelector('#badge-docs').textContent) >= 1, 8000);
    doc.querySelector('[data-action="load-data"]').click();
    await waitFor(() => doc.querySelector('#modal-root .modal-backdrop.open'), 5000);
    doc.querySelector('#modal-root [data-action="confirm-refresh-gl"]').click();
    await waitFor(() => /GL report loaded|Could not load GL report/.test(doc.querySelector('#toast-wrap').textContent), 12000);
    doc.querySelector('[data-tab="trial-balance"]').click();
    await waitFor(() => /Selected-Transaction Trial Balance/i.test(doc.querySelector('#view').textContent), 5000);
    const view = doc.querySelector('#view').textContent.replace(/\s+/g, ' ').trim();
    const set = (selector, value, type) => {
      const el = doc.querySelector(selector);
      if (!el) throw new Error('missing ' + selector);
      el.value = value;
      el.dispatchEvent(new win.Event(type || 'input', { bubbles: true }));
    };
    doc.querySelector('[data-tab="settings"]').click();
    doc.querySelector('[data-action="save-config"]').click();
    await waitFor(() => doc.querySelector('#modal-root [data-action="confirm-save-config"]'), 5000);
    doc.querySelector('#modal-root [data-action="confirm-save-config"]').click();
    await waitFor(() => /FBR configuration saved|Could not save/.test(doc.querySelector('#toast-wrap').textContent), 8000);
    const configToast = doc.querySelector('#toast-wrap').textContent.replace(/\s+/g, ' ').trim();
    const configCreated = lastCreated && lastCreated.value.description;
    doc.querySelector('[data-tab="adjustments"]').click();
    doc.querySelector('[data-action="new-adjustment"]').click();
    set('#editor-description', 'Smoke adjustment');
    set('#editor-reason', 'Smoke only');
    set('#editor-lines [data-line-index="0"] [data-line-field="accountKey"]', 'acc-sales', 'change');
    set('#editor-lines [data-line-index="0"] [data-line-field="debit"]', '100');
    doc.querySelector('[data-action="add-line"]').click();
    set('#editor-lines [data-line-index="1"] [data-line-field="accountKey"]', 'acc-bank', 'change');
    set('#editor-lines [data-line-index="1"] [data-line-field="credit"]', '100');
    doc.querySelector('[data-action="save-editor"]').click();
    await waitFor(() => doc.querySelector('#modal-root [data-action="confirm-save-editor"]'), 5000);
    doc.querySelector('#modal-root [data-action="confirm-save-editor"]').click();
    await waitFor(() => doc.querySelector('#badge-adj') && Number(doc.querySelector('#badge-adj').textContent) >= 1, 8000);
    const adjCreated = lastCreated && lastCreated.value.description;
    doc.querySelector('[data-tab="trial-balance"]').click();
    const adjustedView = doc.querySelector('#view').textContent.replace(/\s+/g, ' ').trim();
    out({
      ok: !errors.length,
      docsBadge: loadedBadge,
      connection: doc.querySelector('#conn-text').textContent,
      trialBalanceRendered: /Selected-Transaction Trial Balance/i.test(view),
      trialBalanceAmount: /1000\.00/.test(view),
      configToast: configToast,
      configCreated: configCreated,
      adjustmentCreated: adjCreated,
      adjustmentBadge: doc.querySelector('#badge-adj').textContent,
      adjustedTrialBalance: /900\.00/.test(adjustedView),
      errors,
      viewSample: adjustedView.slice(0, 600),
      calls: log
    });
  } catch (e) {
    out({ ok: false, error: String(e), errors, calls: log, view: doc.querySelector('#view') ? doc.querySelector('#view').textContent.slice(0, 800) : '' });
  }
});
</script>
</body></html>
